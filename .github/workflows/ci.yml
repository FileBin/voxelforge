name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет прошлый прогон — иначе на каждый коммит
# копится очередь и письма о падении приходят пачкой.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # CI идёт через тот же flake.lock, что и локально: версии rustc, glslc
      # и mesa не могут разъехаться между машиной и раннером.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # SPIR-V собирается один раз и переиспользуется всеми шагами: без него
      # тесты живого раскола и демо мира просто пропускаются.
      - name: шейдеры
        run: nix build .#spirv -o /tmp/spv

      # --bins обязателен: раньше дальше по шагам ждали target/release/voxelforge,
      # а предыдущий шаг собирал только vf-ref — отсюда падение «файла нет».
      - name: сборка (release, все бинари)
        run: |
          nix develop --command bash -c '
            export VF_SHADERS=/tmp/spv
            cargo build --release --locked --bins
          '

      - name: тесты
        run: |
          nix develop --command bash -c '
            export VF_SHADERS=/tmp/spv
            cargo test --release --locked
          '

      - name: "демо-гейты: орбита и мир на lavapipe"
        run: |
          mkdir -p demos/out
          nix develop --command bash -euo pipefail -c '
            export VF_SHADERS=/tmp/spv
            ./target/release/vf-ref --scenario orbit --frames 1500 --periods 2 \
              --substeps 4 --json demos/out/orbit.json --out demos/out/orbit.vfr
            ./target/release/voxelforge --shaders /tmp/spv --frames 60 \
              --out demos/out/world.vfw | tee demos/out/world.log
            test -s demos/out/world.vfw
            test -s demos/out/orbit.vfr
            grep -q "раскалывается на" demos/out/world.log
          '

      # Живое окно: SDL3-слой и графические конвейеры должны собираться.
      # Сам прогон под виртуальным композитором (sway + lavapipe) слишком
      # тяжёл для раннера — он проверяется локально: nix build .#checks...live-headless
      - name: сборка живого окна
        run: nix build .#live --no-link
