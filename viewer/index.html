<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxelforge · BCC (WebGL2)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #cfd8e3;
               font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; inset: 0 0 auto 0; display: flex; gap: 10px; align-items: center;
         padding: 9px 12px; background: #0b0f14cc; backdrop-filter: blur(6px);
         border-bottom: 1px solid #1b2733; flex-wrap: wrap; z-index: 10; }
  #bar b { color: #e8f0f8; letter-spacing: .3px; }
  #bar .hint { color: #5d7286; }
  button, select, input[type=range] { background: #131c25; color: #cfd8e3;
         border: 1px solid #253545; border-radius: 6px; padding: 4px 10px; font: inherit; }
  button:hover { border-color: #3b5875; }
  input[type=range] { padding: 0; width: 190px; }
  #meta { margin-left: auto; color: #6b8299; font-variant-numeric: tabular-nums; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #msg { position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
         gap: 10px; color: #5d7286; padding: 24px; pointer-events: none; }
  #msg b { color: #8fa8bf; font-size: 15px; }
</style>
</head>
<body>
<div id="bar">
  <b>voxelforge</b>
  <input id="file" type="file" accept=".vfw,.vfr" style="max-width:170px">
  <button id="play">⏸ пауза</button>
  <button id="prev10" title="−10 кадров (Shift+←)">«10</button>
  <button id="prev" title="предыдущий кадр (←)">◀</button>
  <button id="next" title="следующий кадр (→)">▶</button>
  <button id="next10" title="+10 кадров (Shift+→)">10»</button>
  <input id="frame" type="range" min="0" max="0" value="0">
  <span id="pos" class="hint">—</span>
  <select id="speed">
    <option value="15">0.25×</option>
    <option value="30">0.5×</option>
    <option value="60" selected>1×</option>
    <option value="120">2×</option>
    <option value="240">4×</option>
  </select>
  <span class="hint">ЛКМ — орбита · колесо — зум · ПКМ/Shift+ЛКМ — пан · пробел — пауза</span>
  <span id="meta">нет данных</span>
</div>
<canvas id="cv"></canvas>
<div id="msg"><b>перетащите .vfw или .vfr в окно</b><span>мир движка или траектории эталона · читается локально</span></div>

<!-- Логика в модулях: parse — форматы, bcc — геометрия ячейки, gl/render-* —
     графика, camera — управление, ui — панель. Открывать через http
     (nix run .#viewer): браузеры блокируют модульные скрипты с file://. -->
<script type="module" src="./js/main.js"></script>
</body>
</html>
