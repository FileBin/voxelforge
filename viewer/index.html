<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>voxelforge · просмотр траекторий</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f14; color: #cfd8e3;
               font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  #bar { display: flex; gap: 12px; align-items: center; padding: 10px 14px;
         border-bottom: 1px solid #1b2733; flex-wrap: wrap; }
  #bar b { color: #e8f0f8; font-weight: 600; letter-spacing: .3px; }
  #bar .hint { color: #5d7286; }
  button, select, input[type=range] { background: #131c25; color: #cfd8e3;
         border: 1px solid #253545; border-radius: 6px; padding: 4px 10px; font: inherit; }
  button:hover { border-color: #3b5875; }
  input[type=range] { padding: 0; width: 260px; }
  #meta { margin-left: auto; color: #6b8299; font-variant-numeric: tabular-nums; }
  #wrap { position: absolute; inset: 47px 0 0 0; }
  canvas { display: block; width: 100%; height: 100%; }
  #drop { position: absolute; inset: 0; display: grid; place-content: center;
          text-align: center; color: #5d7286; gap: 8px; pointer-events: none; }
  #drop b { color: #8fa8bf; }
</style>
</head>
<body>
<div id="bar">
  <b>voxelforge</b>
  <input id="file" type="file" accept=".vfr" style="max-width:220px">
  <button id="play">⏸ пауза</button>
  <input id="frame" type="range" min="0" max="0" value="0">
  <select id="speed">
    <option value="15">0.25×</option>
    <option value="30">0.5×</option>
    <option value="60" selected>1× (60 fps)</option>
    <option value="120">2×</option>
    <option value="240">4×</option>
  </select>
  <span class="hint">пробел — пауза, перетащите .vfr в окно</span>
  <span id="meta">нет данных</span>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="drop"><b>перетащите .vfr</b><span>или выберите файл — файл читается локально, никуда не уходит</span></div>
</div>
<script>
"use strict";

const $ = (id) => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const PALETTE = ["#59a5ff", "#ffb347", "#7ee08a", "#ff6b8a", "#c48aff", "#4fd6d6"];

let sim = null;        // {n, nf, radii, frames, lo, hi}
let frame = 0;
let playing = true;
let speed = 60;        // кадров в секунду
let acc = 0, last = 0;

function parseVFR(buf) {
  const dv = new DataView(buf);
  const magic = String.fromCharCode(dv.getUint8(0), dv.getUint8(1), dv.getUint8(2), dv.getUint8(3));
  if (magic !== "VFR1") throw new Error("не VFR1: " + magic);
  const n = dv.getUint32(4, true), nf = dv.getUint32(8, true);
  let off = 12;
  const radii = [];
  for (let i = 0; i < n; i++) {
    off += 8;                                  // mass (f64), не нужна для картинки
    radii.push(dv.getFloat32(off, true)); off += 4;
  }
  const frames = [];
  const lo = [Infinity, Infinity], hi = [-Infinity, -Infinity];
  for (let f = 0; f < nf; f++) {
    const arr = new Float32Array(n * 3);
    for (let k = 0; k < n * 3; k++) { arr[k] = dv.getFloat32(off, true); off += 4; }
    frames.push(arr);
    for (let i = 0; i < n; i++) {
      const x = arr[3 * i], y = arr[3 * i + 1];
      if (x < lo[0]) lo[0] = x; if (x > hi[0]) hi[0] = x;
      if (y < lo[1]) lo[1] = y; if (y > hi[1]) hi[1] = y;
    }
  }
  return { n, nf, radii, frames, lo, hi };
}

function loadArrayBuffer(buf, name) {
  try {
    sim = parseVFR(buf);
  } catch (e) {
    $("meta").textContent = "ошибка: " + e.message;
    return;
  }
  frame = 0;
  $("frame").max = String(sim.nf - 1);
  $("frame").value = "0";
  $("drop").style.display = "none";
  $("meta").textContent = `${name} · тел: ${sim.n}, кадров: ${sim.nf}`;
  last = performance.now();
  requestAnimationFrame(tick);
}

async function openFile(file) {
  const buf = await file.arrayBuffer();
  loadArrayBuffer(buf, file.name);
}

$("file").addEventListener("change", (e) => { if (e.target.files[0]) openFile(e.target.files[0]); });
$("play").addEventListener("click", () => { playing = !playing; syncPlayLabel(); });
$("speed").addEventListener("change", (e) => { speed = +e.target.value; });
$("frame").addEventListener("input", (e) => { frame = +e.target.value; draw(); });
window.addEventListener("keydown", (e) => {
  if (e.code === "Space") { e.preventDefault(); playing = !playing; syncPlayLabel(); }
});
["dragenter", "dragover"].forEach((ev) =>
  window.addEventListener(ev, (e) => { e.preventDefault(); }));
window.addEventListener("drop", (e) => {
  e.preventDefault();
  const f = e.dataTransfer.files[0];
  if (f) openFile(f);
});

function syncPlayLabel() { $("play").textContent = playing ? "⏸ пауза" : "▶ играть"; }

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (sim && playing) {
    acc += dt * speed;
    const steps = Math.floor(acc);
    if (steps > 0) {
      acc -= steps;
      frame = (frame + steps) % sim.nf;
      $("frame").value = String(frame);
    }
  }
  draw();
  requestAnimationFrame(tick);
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  ctx.fillStyle = "#0b0f14";
  ctx.fillRect(0, 0, w, h);
  if (!sim) return;

  const cx = (sim.lo[0] + sim.hi[0]) / 2, cy = (sim.lo[1] + sim.hi[1]) / 2;
  const span = Math.max(sim.hi[0] - sim.lo[0], sim.hi[1] - sim.lo[1], 1e-6) * 0.55;
  const s = Math.min(w, h) * 0.5 / span;
  const X = (x) => w * 0.5 + (x - cx) * s;
  const Y = (y) => h * 0.5 - (y - cy) * s;

  // следы — только когда тел немного
  if (sim.n <= 64) {
    const tail = 90;
    for (let i = 0; i < sim.n; i++) {
      ctx.beginPath();
      const f0 = Math.max(0, frame - tail);
      for (let f = f0; f <= frame; f++) {
        const a = sim.frames[f], x = X(a[3 * i]), y = Y(a[3 * i + 1]);
        f === f0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = PALETTE[i % PALETTE.length] + "88";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  const cur = sim.frames[frame];
  for (let i = 0; i < sim.n; i++) {
    const x = X(cur[3 * i]), y = Y(cur[3 * i + 1]);
    const r = Math.max(1.5, Math.min(sim.radii[i] * s, 16));
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
  }

  ctx.fillStyle = "#5d7286";
  ctx.font = "12px ui-monospace, monospace";
  ctx.fillText(`кадр ${frame + 1} / ${sim.nf}`, 14, h - 14);
}

// Если страница открыта по http (python -m http.server), подхватываем ?file=
const q = new URLSearchParams(location.search).get("file");
if (q) fetch(q).then((r) => r.arrayBuffer()).then((b) => loadArrayBuffer(b, q)).catch(() => {});
syncPlayLabel();
requestAnimationFrame(tick);
</script>
</body>
</html>
