[package]
name = "voxelforge-world"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]

[features]
live = []
# CPU-солвер: столкновения, развязка и пробуждение считаются на CPU, плюс
# зеркало поз на CPU. Нужен только эталонной симуляции в тестах; в движке
# (nix build .#live) не собирается вовсе.
cpu-solver = []

[[bin]]
name = "voxelforge-live"
path = "src/bin/voxelforge_live.rs"
required-features = ["live"]

[[bin]]
name = "vf-bench"
path = "src/bin/vf_bench.rs"
required-features = ["live"]
